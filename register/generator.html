<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>注册码生成器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: 20px;
    }

    .box {
      max-width: 620px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    h3 {
      color: #444;
      margin: 20px 0 10px;
      font-size: 1.1em;
    }

    textarea,
    input,
    select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      margin-left: 10px;
      display: inline-block;
      background: #6c757d;
    }

    .btn-small:hover {
      background: #5a6268;
    }

    .copy {
      float: right;
      font-size: 12px;
      background: #e9ecef;
      color: #495057;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }

    .copy:hover {
      background: #dee2e6;
    }

    .msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      display: none;
      animation: fade 0.3s;
    }

    @keyframes fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .ok {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .err {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .section {
      border-bottom: 1px solid #eee;
      padding-bottom: 25px;
      margin-bottom: 25px;
    }

    .section:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .download-area {
      margin-top: 15px;
      padding: 15px;
      background: #f0f8ff;
      border-radius: 8px;
      border: 1px dashed #007bff;
      font-size: 14px;
    }

    .note {
      font-size: 13px;
      color: #d32f2f;
      margin-top: 10px;
      line-height: 1.5;
    }

    .success {
      color: #28a745;
      font-weight: bold;
    }

    .hash-box {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-family: monospace;
      word-break: break-all;
    }

    .hash-label {
      font-weight: bold;
      color: #856404;
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>注册码生成器</h2>

    <div class="section">
      <h3>步骤 1：生成 RSA 密钥对</h3>
      <button onclick="generateKeys()" style="background:#28a745;">生成密钥对（2048位）</button>

      <div id="keyOutput" style="display:none;" class="download-area">
        <p><span class="success">私钥已自动下载</span> → <code id="privFile">private_key.pem</code></p>
        <button class="btn-small" onclick="downloadPrivate()">重新下载私钥</button>

        <p style="margin-top:18px;"><strong>公钥（复制到 activation.html）</strong></p>
        <textarea id="publicKey" rows="10" readonly></textarea>
        <span class="copy" onclick="copy('publicKey')">复制公钥</span>

        <div class="hash-box">
          <span class="hash-label">EXPECTED_PUBKEY_HASH（复制到 activation.html）</span>
          <code id="pubkeyHash"></code>
          <span class="copy" onclick="copyHash()">复制哈希</span>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>步骤 2：生成注册码（一码一用）</h3>

      <label>用户机器码</label>
      <textarea id="machine" rows="3" placeholder="粘贴用户提供的机器码（Base64）"></textarea>

      <label>有效天数</label>
      <select id="days">
        <option value="7">7 天</option>
        <option value="30">30 天</option>
        <option value="90">90 天（3个月）</option>
        <option value="365">365 天（1年）</option>
        <option value="0">永久激活</option>
      </select>

      <label>私钥文件（.pem）</label>
      <input type="file" id="privKeyFile" accept=".pem,text/plain" />

      <button onclick="generateCode()">生成注册码</button>

      <label>注册码（发给用户）</label>
      <textarea id="code" rows="3" readonly></textarea>
      <span class="copy" onclick="copy('code')">复制注册码</span>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsrsasign@10.8.6/lib/jsrsasign-all-min.js"></script>
  <script>
    let PRIVATE_PEM = '';
    let PUBLIC_PEM = '';

    function generateKeys() {
      try {
        const rsa = KEYUTIL.generateKeypair("RSA", 2048);
        PRIVATE_PEM = KEYUTIL.getPEM(rsa.prvKeyObj, "PKCS8PRV");
        PUBLIC_PEM = KEYUTIL.getPEM(rsa.pubKeyObj);

        document.getElementById('publicKey').value = PUBLIC_PEM;
        document.getElementById('keyOutput').style.display = 'block';

        const normalized = PUBLIC_PEM.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\s+/g, '');
        const hash = KJUR.crypto.Util.sha256(normalized);
        document.getElementById('pubkeyHash').textContent = hash;

        downloadBlob(PRIVATE_PEM, 'private_key.pem');
        document.getElementById('privFile').textContent = 'private_key.pem';

        show('密钥对 + 哈希生成成功！', 'ok');
      } catch (e) {
        show('生成失败：' + e.message, 'err');
      }
    }

    function downloadPrivate() {
      if (!PRIVATE_PEM) return show('请先生成密钥！', 'err');
      downloadBlob(PRIVATE_PEM, 'private_key.pem');
      alert('私钥已重新下载');
    }

    function downloadBlob(text, filename) {
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function copyHash() {
      const hash = document.getElementById('pubkeyHash').textContent;
      navigator.clipboard.writeText(hash).then(() => {
        const btn = event.target; const orig = btn.textContent;
        btn.textContent = '已复制'; setTimeout(() => btn.textContent = orig, 1000);
      });
    }

    async function generateCode() {
      const machineB64 = document.getElementById('machine').value.trim();
      const fileInput = document.getElementById('privKeyFile');
      const msg = document.getElementById('msg');
      msg.style.display = 'none';

      if (!machineB64) return show('请输入用户硬件指纹', 'err');

      let privPEM = '';
      if (fileInput.files && fileInput.files[0]) {
        try { privPEM = await fileInput.files[0].text(); }
        catch (e) { return show('读取私钥失败', 'err'); }
      } else if (PRIVATE_PEM) {
        privPEM = PRIVATE_PEM;
      } else {
        return show('请上传私钥文件或先生成密钥', 'err');
      }

      if (!privPEM.includes('PRIVATE KEY')) return show('私钥格式错误', 'err');

      const days = parseInt(document.getElementById('days').value);
      const isPermanent = days === 0;
      const expValue = isPermanent ? 0 : days;

      // 随机 salt（保证每次注册码不同）
      const saltArray = crypto.getRandomValues(new Uint8Array(8));
      const salt = Array.from(saltArray).map(b => b.toString(16).padStart(2, '0')).join('');

      const expB64 = btoa(String(expValue)).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
      const payload = `${machineB64}.${expB64}.${salt}`;

      try {
        const sig = new KJUR.crypto.Signature({ alg: 'SHA256withRSA' });
        sig.init(privPEM);
        sig.updateString(payload);
        const signature = sig.sign().replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

        const code = `${payload}.${signature}`;
        document.getElementById('code').value = code;
        show(isPermanent ? '永久注册码生成成功！' : '注册码生成成功！', 'ok');
      } catch (e) {
        show('签名失败：' + e.message, 'err');
      }
    }

    function copy(id) {
      const el = document.getElementById(id);
      const text = el.value || el.textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target; const orig = btn.textContent;
        btn.textContent = '已复制'; setTimeout(() => btn.textContent = orig, 1000);
      }).catch(() => {
        el.select(); el.setSelectionRange(0, 99999); document.execCommand('copy');
        alert('已复制（旧版）');
      });
    }

    function show(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = 'msg ' + type;
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 4000);
    }
  </script>
</body>

</html>
