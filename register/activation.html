<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>系统激活</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0
        }

        .box {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1)
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            color: #555
        }

        textarea,
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box
        }

        textarea[readonly] {
            background: #f8f9fa;
            cursor: text
        }

        button {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px
        }

        button:hover {
            background: #218838
        }

        .copy {
            float: right;
            font-size: 12px;
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px
        }

        .msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.3s
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .ok {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb
        }

        .err {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>系统激活</h2>
        <label>1. 机器码</label>
        <textarea id="machine" rows="3" readonly onclick="this.select()"></textarea>
        <span class="copy" onclick="copy('machine')">复制</span>

        <label>2. 注册码</label>
        <input type="text" id="code" placeholder="粘贴注册码">

        <button onclick="activate()">激活</button>
        <div id="msg" class="msg"></div>
    </div>

    <script src="./jsrsasign-all-min.js"></script>
    <script>
        // ============== 公钥（完整 PEM） ==============
        const PUBLIC_KEY = `-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA02venGHQQ2/sgtPZWCW4
UiJId9NwMScdV5fbjejMz3kTGoqcTn+7ETNxASdUHVcOfpCI+srWXVXkaEggdaQn
YcRdJYsd+z7WCObRece2d1GuiXyMr3IlG2D0ifmu58heocUl23XBXnWkhN+ZM9G/
rOID9O1c2SbOtLxrNTj3P+ERylvxGdNw9ZhfrGL6KtsmEBXgtYm3lKp+wK7ays4r
AQnc/IgPkwXJky0CCupfhGX2W5lqkC7S10cOPiZbHC894IdRTYVS0JRxccn6H8xa
BSihCGandId9964TKcjkcZBH4klCQa26wuEITvsda/sHvM3DbNwc4I5ce9ue9QuY
wQIDAQAB
-----END PUBLIC KEY-----`;

        const PUBLIC_KEY_NORMALIZED = PUBLIC_KEY
            .replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\s+/g, '');

        if (KJUR.crypto.Util.sha256(PUBLIC_KEY_NORMALIZED) !== "212daa753bbce3d69aa03664d8bdacd3f1d2efd98471e83849a9895584f57b18") {
            document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:50px;'>错误：公钥被篡改！</h1>";
            throw new Error("公钥校验失败");
        }

        // ============== IndexedDB ==============
        const DB_NAME = 'ActivationDB', STORE_NAME = 'activation';
        let db;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = e => {
                    db = e.target.result;
                    db.createObjectStore(STORE_NAME);
                };
                request.onsuccess = e => { db = e.target.result; resolve(db); };
                request.onerror = e => reject(e);
            });
        }

        async function setItem(key, value) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(value, key);
                tx.oncomplete = () => resolve();
                tx.onerror = e => reject(e);
            });
        }

        async function getItem(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = e => reject(e);
            });
        }

        // ============== 硬件指纹 ==============
        async function genHardwareFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'alphabetic';
            ctx.font = '14px "Arial"';
            ctx.fillStyle = '#f60'; ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = '#069'; ctx.fillText('Cwm fjordbank glyphs vext quiz', 2, 15);
            ctx.fillStyle = 'rgba(102, 204, 0, 0.7)'; ctx.fillText('Cwm fjordbank glyphs vext quiz', 4, 17);

            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            let glInfo = {};
            if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                glInfo = {
                    renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
                    vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
                    version: gl.getParameter(gl.VERSION),
                    shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
                    extensions: gl.getSupportedExtensions()
                };
            }

            let audioHash = 'no';
            try {
                const audioCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100, 44100);
                const oscillator = audioCtx.createOscillator();
                oscillator.type = 'triangle'; oscillator.frequency.value = 10000;
                const compressor = audioCtx.createDynamicsCompressor();
                oscillator.connect(compressor); compressor.connect(audioCtx.destination);
                oscillator.start(0);
                const buffer = await audioCtx.startRendering();
                audioHash = KJUR.crypto.Util.sha256(buffer.getChannelData(0).join(','));
            } catch (e) { }

            const data = {
                canvas: canvas.toDataURL(),
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screen: `${screen.width}x${screen.height}x${screen.colorDepth}`,
                timezone: new Date().getTimezoneOffset(),
                cores: navigator.hardwareConcurrency,
                memory: navigator.deviceMemory,
                gl: glInfo,
                audio: audioHash,
                plugins: Array.from(navigator.plugins || []).map(p => p.name).join('|'),
                timezoneStr: Intl.DateTimeFormat().resolvedOptions().timeZone
            };

            return btoa(JSON.stringify(data));
        }

        (async () => {
            const fingerprint = await genHardwareFingerprint();
            document.getElementById('machine').value = fingerprint;
        })();

        function copy(id) {
            const el = document.getElementById(id);
            navigator.clipboard.writeText(el.value).then(() => alert('已复制'))
                .catch(() => { el.select(); document.execCommand('copy'); alert('已复制（旧版）'); });
        }

        function safeB64Decode(str) {
            try {
                const normalized = str.replace(/-/g, '+').replace(/_/g, '/');
                const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
                return atob(padded);
            } catch (e) { return null; }
        }

        // ============== 激活函数（一码一用） ==============
        async function activate() {
            const machine = document.getElementById('machine').value;
            const code = document.getElementById('code').value.trim();
            const msg = document.getElementById('msg');
            msg.style.display = 'none';

            if (!code) return show('请输入注册码', 'err');
            const parts = code.split('.');
            if (parts.length !== 4) return show('注册码格式错误', 'err');

            const [mB64, expB64, salt, sig] = parts;
            if (mB64 !== machine) return show('硬件指纹不匹配', 'err');

            const expStr = safeB64Decode(expB64);
            if (!expStr) return show('注册码解析失败', 'err');
            const maxDays = parseInt(expStr, 10);
            if (isNaN(maxDays) || maxDays < 0) return show('注册码无效', 'err');

            const payload = `${mB64}.${expB64}.${salt}`;
            const verify = new KJUR.crypto.Signature({ alg: 'SHA256withRSA' });
            verify.init(PUBLIC_KEY);
            verify.updateString(payload);
            const sigPadded = sig.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - sig.length % 4) % 4);
            if (!verify.verify(sigPadded)) return show('签名错误', 'err');

            const isPermanent = maxDays === 0;
            const effectiveMaxDays = isPermanent ? -1 : maxDays;

            const STORAGE_KEY = 'activation_v4';
            let data = await getItem(STORAGE_KEY) || {};

            // 检查此注册码是否已使用
            if (data.usedCodes && data.usedCodes.includes(code)) {
                return show('此注册码已使用过！', 'err');
            }

            // 业务标识：指纹 + 天数
            const businessKey = `${machine}.${expB64}`;

            // if (data.businessKey === businessKey) {
            //     const totalUsed = Math.floor(data.totalRuntime / 86400);
            //     if (!isPermanent && totalUsed >= effectiveMaxDays) {
            //         return show('该设备已用完此期限，无法续期', 'err');
            //     }
            // }

            // 标记此码已使用
            if (!data.usedCodes) data.usedCodes = [];
            data.usedCodes.push(code);

            // 更新激活数据
            data = {
                ...data,
                machine, code,
                maxDays: effectiveMaxDays,
                totalRuntime: 0,
                businessKey,
                firstActivated: data.firstActivated || Date.now(),
                lastCheck: Date.now(),
                segments: [],
                hash: ''
            };

            startTracker(data);
            data.hash = computeHash(data);
            await setItem(STORAGE_KEY, data);

            const totalUsed = Math.floor(data.totalRuntime / 86400);
            if (isPermanent) {
                show('永久激活成功！', 'ok');
            } else if (totalUsed >= effectiveMaxDays) {
                show('该设备已用完此期限', 'err');
            } else {
                show(`激活成功！剩 ${effectiveMaxDays - totalUsed} 天`, 'ok');
            }
            setTimeout(() => location.reload(), 2000);
        }

        function show(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = 'msg ' + type;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }

        function computeHash(data) {
            const { hash, ...pure } = data;
            return KJUR.crypto.Util.sha256(JSON.stringify(pure) + PUBLIC_KEY_NORMALIZED.slice(-50));
        }

        function verifyIntegrity(data) {
            return data.hash === computeHash(data);
        }

        let interval = null;
        async function startTracker(data) {
            if (interval) return;
            interval = setInterval(async () => {
                const now = Date.now();
                const deltaSec = Math.floor((now - data.lastCheck) / 1000);
                if (deltaSec >= 60) {
                    data.totalRuntime += deltaSec;
                    const seg = [now - deltaSec * 1000, now];
                    if (data.segments.length > 0 && seg[0] < data.segments[data.segments.length - 1][1]) {
                        indexedDB.deleteDatabase(DB_NAME);
                        clearInterval(interval);
                        document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:50px;'>检测到时间篡改！</h1>";
                        return;
                    }
                    data.segments.push(seg);
                    data.lastCheck = now;
                    data.hash = computeHash(data);
                    await setItem('activation_v4', data);
                }
            }, 5000);
        }

        window.addEventListener('beforeunload', async () => {
            const data = await getItem('activation_v4');
            if (data && data.lastCheck) {
                const delta = Math.floor((Date.now() - data.lastCheck) / 1000);
                if (delta > 0) {
                    data.totalRuntime += delta;
                    data.hash = computeHash(data);
                    await setItem('activation_v4', data);
                }
            }
        });

        window.addEventListener('load', async () => {
            const data = await getItem('activation_v4');
            if (data && data.businessKey && verifyIntegrity(data)) {
                data.lastCheck = Date.now();
                startTracker(data);
                const used = Math.floor(data.totalRuntime / 86400);
                if (data.maxDays === -1) {
                    show('永久激活中...', 'ok');
                } else if (used < data.maxDays) {
                    show(`剩 ${data.maxDays - used} 天`, 'ok');
                } else {
                    show('已过期', 'err');
                }
            }
        });

        setInterval(() => {
            const t = performance.now();
            let sum = 0;
            for (let i = 0; i < 5e6; i++) sum += Math.sin(i);
            if (performance.now() - t > 300) {
                document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:50px;'>检测到异常</h1>";
            }
        }, 2000);
    </script>
</body>

</html>
